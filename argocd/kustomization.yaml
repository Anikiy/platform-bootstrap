apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: argocd

# Официальные базовые манифесты Argo CD с pinned-версией.
# В проде замените `stable` на конкретный тег, например `v3.5.0`.
resources:
  - https://github.com/argoproj/argo-cd//manifests/cluster-install?ref=stable
  - resources/ingress.yaml
  - resources/projects/platform-project.yaml
  - apps/root-app.yaml
  - apps/argocd-self.yaml

patches:
  - path: patches/argocd-cm.yaml
  - path: patches/argocd-rbac-cm.yaml
  - path: patches/argocd-cmd-params-cm.yaml
  - path: patches/argocd-repo-server-deployment.yaml