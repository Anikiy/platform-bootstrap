apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: guestbook-target
  namespace: argocd
spec:
  project: platform
  source:
    repoURL: https://github.com/argoproj/argocd-example-apps.git
    targetRevision: HEAD
    path: guestbook
  destination:
    server: https://172.20.0.6:6443
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
