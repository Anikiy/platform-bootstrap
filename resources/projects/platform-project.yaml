apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform
  namespace: argocd
spec:
  description: Platform services managed by platform-team
  sourceRepos:
    - 'https://github.com/<USER>/argocd-install.git'
    - 'https://github.com/keycloak/keycloak-k8s-resources'
    - 'https://charts.jetstack.io'           # для cert-manager
    - 'https://prometheus-community.github.io/helm-charts'
  destinations:
    - server: https://kubernetes.default.svc
      namespace: '*'
  clusterResourceWhitelist:
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
  namespaceResourceBlacklist:
    - group: ''
      kind: ResourceQuota
    - group: ''
      kind: LimitRange
  roles:
    - name: admin
      policies:
        - p, proj:platform:admin, applications, *, platform/*, allow
        - p, proj:platform:admin, repositories, *, platform/*, allow
      groups:
        - platform-team